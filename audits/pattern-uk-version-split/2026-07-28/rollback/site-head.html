<!-- Shared page-function registry -->
<script>
  (function (global) {
    global.pageFunctions = global.pageFunctions || {
      executed: {},
      functions: {},
      added: false,

      addFunction: function (id, fn) {
        if (!id || typeof fn !== "function") return;

        if (!this.functions[id]) {
          this.functions[id] = fn;
        }
      },

      executeFunctions: function () {
        if (this.added) return;
        this.added = true;

        for (var id in this.functions) {
          if (
            Object.prototype.hasOwnProperty.call(this.functions, id) &&
            !this.executed[id]
          ) {
            try {
              this.functions[id]();
              this.executed[id] = true;
            } catch (error) {
              console.error(
                "Error executing page function " + id + ":",
                error
              );
            }
          }
        }
      }
    };
  })(window);
</script>

<!-- Restore Webflow interactions after CMS Slider initializes -->
<script>
  window.fsAttributes = window.fsAttributes || [];

  window.fsAttributes.push([
    "cmsslider",
    function () {
      if (!window.Webflow) return;

      try {
        window.Webflow.destroy();
        window.Webflow.ready();

        var interactions = window.Webflow.require("ix2");

        if (interactions && typeof interactions.init === "function") {
          interactions.init();
        }

        document.dispatchEvent(new Event("readystatechange"));
      } catch (error) {
        console.error(
          "Unable to restore Webflow interactions after CMS Slider:",
          error
        );
      }
    }
  ]);
</script>
