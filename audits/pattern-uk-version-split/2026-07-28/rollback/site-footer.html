<!-- Execute registered page functions once dependencies are ready -->
<script>
  (function () {
    function runPageFunctions() {
      if (
        window.pageFunctions &&
        typeof window.pageFunctions.executeFunctions === "function"
      ) {
        window.pageFunctions.executeFunctions();
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener(
        "DOMContentLoaded",
        runPageFunctions,
        { once: true }
      );
    } else {
      runPageFunctions();
    }
  })();
</script>
