<!-- Execute registered page functions -->
<script>
  (function () {
    function runPageFunctions() {
      if (
        window.pageFunctions &&
        typeof window.pageFunctions.executeFunctions === "function"
      ) {
        window.pageFunctions.executeFunctions();
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener(
        "DOMContentLoaded",
        runPageFunctions,
        { once: true }
      );
    } else {
      runPageFunctions();
    }
  })();
</script>

<!--
  Pattern Version Gateway V3 activation loader.

  This release activates PVG only on explicitly marked V3 pages. V1, V2, and
  V2L keep their existing production scripts because legacyPolicy="preserve".

  Keep the current legacy footer scripts installed during this release.
-->
<script>
  (() => {
    const selector = 'script[data-pattern-pvg-loader]';
    const activate = () =>
      window.PatternVersionGateway?.activate({
        legacyPolicy: 'preserve',
      });

    if (window.PatternVersionGateway?.version) {
      void activate();
      return;
    }

    const pending = document.querySelector(selector);
    if (pending) {
      pending.dataset.pvgMode = 'active';
      pending.dataset.pvgLegacyPolicy = 'preserve';
      pending.addEventListener('load', activate, { once: true });
      return;
    }

    const script = document.createElement('script');
    script.src =
      'https://cdn.jsdelivr.net/gh/specterstudio/pattern@e1f9e1dcb471968fe118041ce64e8d213784e469/webflow/pattern.com/scripts/runtime/pattern-version-gateway.js';
    script.async = true;
    script.crossOrigin = 'anonymous';
    script.integrity =
      'sha384-bIT8KR6EUl79Zw5ISdiCvSvoVf7dj1PfzmbOu6mbA9BnuCsWhSGmJc3cioOVeCAQ';
    script.dataset.patternPvgLoader = '0.2.3';
    script.dataset.pvgMode = 'active';
    script.dataset.pvgLegacyPolicy = 'preserve';
    script.addEventListener(
      'error',
      () => {
        console.warn(
          '[Pattern PVG] The V3 runtime could not load. Existing production scripts remain unchanged.',
        );
      },
      { once: true },
    );

    document.head.appendChild(script);
  })();
</script>
